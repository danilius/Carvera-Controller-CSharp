name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test CarveraController.slnx -c Release

      - name: Publish (self-contained, win-x64)
        run: dotnet publish src/Carvera.App/Carvera.App.csproj -c Release -r win-x64 --self-contained true -o publish/CarveraController

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: CarveraController-win-x64
          path: publish/CarveraController

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path publish/CarveraController/* -DestinationPath CarveraController-win-x64.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CarveraController-win-x64.zip
          generate_release_notes: true
